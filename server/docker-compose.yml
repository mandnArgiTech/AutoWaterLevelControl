# FluidLevelMonitor platform — full Docker stack
#
# Prerequisites: ./scripts/generate-mqtt-certs.sh
# Start:         ./scripts/start-docker.sh

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flmDB
      POSTGRES_USER: flmAdmin
      POSTGRES_PASSWORD: flmPass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flmAdmin -d flmDB"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/certs:/mosquitto/certs:ro
      - ./mosquitto/passwd:/mosquitto/passwd:ro
      - ./mosquitto/acl:/mosquitto/acl:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "test -f /mosquitto/certs/server.crt && mosquitto_sub -h localhost -p 1883 -u flmServerAdmin -P flmPass -t '$$SYS/broker/version' -C 1 -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flmDB
      SPRING_DATASOURCE_USERNAME: flmAdmin
      SPRING_DATASOURCE_PASSWORD: flmPass
      FLM_JWT_SECRET: change-me-in-production-use-256-bit-secret-key-here
      FLM_MQTT_BROKER_URL: tcp://mosquitto:1883
      FLM_MQTT_USERNAME: flmServerAdmin
      FLM_MQTT_PASSWORD: flmPass
      FLM_MQTT_TLS_ENABLED: "false"
      FLM_MQTT_TOPIC_FILTER: "+/water/#"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
