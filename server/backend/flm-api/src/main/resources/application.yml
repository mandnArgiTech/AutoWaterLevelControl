spring:
  application:
    name: flm-platform
  datasource:
    url: jdbc:postgresql://localhost:5432/flmDB
    username: flmAdmin
    password: flmPass
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8080

flm:
  jwt:
    secret: change-me-in-production-use-256-bit-secret-key-here
    expiry-seconds: 86400
  mqtt:
    broker-url: tcp://localhost:1883
    client-id: flm-platform-bridge
    username: flmServerAdmin
    password: flmPass
    tls-enabled: false
    topic-filter: "+/water/#"
    qos: 1
  seed:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.flm.platform: INFO
