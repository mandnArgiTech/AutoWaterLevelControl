# Mosquitto — host-native / standalone (no Docker)
# Run from repo: mosquitto -c server/mosquitto/config/mosquitto-standalone.conf
# Paths are relative to this config file directory.

per_listener_settings true

listener 1883 0.0.0.0
protocol mqtt
allow_anonymous false
password_file ../passwd/passwd
acl_file ../acl/acl.conf

listener 8883 0.0.0.0
protocol mqtt
cafile ../certs/ca.crt
certfile ../certs/server.crt
keyfile ../certs/server.key
tls_version tlsv1.2
# MQTT max packet — ESP8266 PubSubClient buffer is 512 bytes
max_packet_size 2048
allow_anonymous false
password_file ../passwd/passwd
acl_file ../acl/acl.conf

persistence true
persistence_location ../data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

max_connections 200
max_keepalive 120
