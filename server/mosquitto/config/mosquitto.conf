# Mosquitto 2.x — Docker deployment
# TLS 1.2 on 8883 for ESP8266 BearSSL (see scripts/generate-mqtt-certs.sh)
# MFLN is negotiated by OpenSSL when ESP8266 sends fragment-length extension.

per_listener_settings true

listener 1883
protocol mqtt
allow_anonymous false
password_file /mosquitto/passwd/passwd
acl_file /mosquitto/acl/acl.conf

listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
max_packet_size 2048
allow_anonymous false
password_file /mosquitto/passwd/passwd
acl_file /mosquitto/acl/acl.conf

# Persistence & logging
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Connection limits
max_connections 200
max_keepalive 120
