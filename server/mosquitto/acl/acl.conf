# Mosquitto ACL — topic layout matches ESP8266 firmware:
#   {deviceTag}/{topicPrefix}/{subtopic}
#   e.g. tank1_a9ad51/water/level

# Platform bridge: ingest all device traffic
user flmServerAdmin
topic readwrite #

# Demo vendor MQTT user (optional direct broker access for integrations)
user vendor_demo
topic read +/water/#
topic read +/water/status
topic write +/water/command
topic read +/motor/#
topic write +/motor/command

# ESP8266 device credentials — default devAdmin / 123456
user devAdmin
topic write +/water/level
topic write +/water/status
topic read +/water/command
topic write +/motor/status
topic read +/motor/command
