# Infrastructure only — MQTT + PostgreSQL in Docker (used by standalone production on host)
# Usage: docker compose -f docker-compose.infra.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flmDB
      POSTGRES_USER: flmAdmin
      POSTGRES_PASSWORD: flmPass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flmAdmin -d flmDB"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/certs:/mosquitto/certs:ro
      - ./mosquitto/passwd:/mosquitto/passwd:ro
      - ./mosquitto/acl:/mosquitto/acl:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "test -f /mosquitto/certs/server.crt && mosquitto_sub -h localhost -p 1883 -u flmServerAdmin -P flmPass -t '$$SYS/broker/version' -C 1 -W 3"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
