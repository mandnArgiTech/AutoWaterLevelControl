# Mosquitto MQTT broker only — used by flm-server.sh
# Certificates: auto-generated by scripts/generate-mqtt-certs.sh before start

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: flm-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/config/dynamic-security.json:/mosquitto/config/dynamic-security.json
      - ./mosquitto/certs:/mosquitto/certs:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "test -f /mosquitto/certs/server.crt && mosquitto_sub -h localhost -p 1883 -u flmServerAdmin -P flmPass -t '$$SYS/broker/version' -C 1 -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  mosquitto_data:
  mosquitto_log:
