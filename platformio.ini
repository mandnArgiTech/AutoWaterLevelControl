; PlatformIO Project Configuration File
; FluidLevelMonitor - Sintex Tank Water Level Monitoring System
;
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages
;
; https://docs.platformio.org/page/projectconf.html

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino

; Serial monitor configuration
monitor_speed = 115200

; Filesystem configuration for LittleFS
board_build.filesystem = littlefs

; Build flags
build_flags = 
    -D VERSION_MAJOR=1
    -D VERSION_MINOR=0
    -D VERSION_PATCH=0
    -D ARDUINOJSON_ENABLE_COMMENTS=1

; Library dependencies
lib_deps = 
    bblanchon/ArduinoJson@^7.0.0
    knolleary/PubSubClient@^2.8
    links2004/WebSockets@^2.4.0
    ESP8266WiFi
    ESP8266WebServer
    ESP8266mDNS
    LittleFS
    DNSServer
    ArduinoOTA

; Extra scripts for auto build number increment
extra_scripts = 
    pre:scripts/build_increment.py
    pre:scripts/gzip_www.py

; Upload settings
upload_speed = 921600

; LittleFS upload tool
upload_protocol = esptool
