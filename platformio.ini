; PlatformIO Project Configuration File
; FluidLevelMonitor — Water Level Monitoring System
;
; THREE FIRMWARE ROLES — same codebase, different compile flags:
;
;   sensor_only   One per tank. D1 Mini + US-100. WiFi + MQTT.
;                 Battery-powered (2× 32700 LiFePO4). Optional deep sleep.
;
;   motor_relay   One per relay-controlled motor (home pump).
;                 GPIO relay. Subscribes to MQTT motor/command.
;
;   motor_sms     One per SMS-controlled motor (farm 5HP + Taro Smart Panel).
;                 SIM800L/A6 GSM. Configurable ON/OFF SMS message strings.
;
; Build:   pio run -e sensor_only_d1mini
;          pio run -e sensor_only_d1mini_sleep   (deep sleep — battery optimized)
;          pio run -e motor_relay
;          pio run -e motor_sms
; Upload:  pio run -e sensor_only_d1mini -t upload
; Monitor: pio device monitor -b 115200

[common]
platform  = espressif8266
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; 160 MHz halves the TLS handshake time (RSA/ECDSA verify) — required for
; reliable MQTT-over-TLS; also speeds up JSON/filter math generally.
board_build.f_cpu = 160000000L
upload_speed = 921600
upload_protocol = esptool
check_tool = cppcheck
check_flags =
    --suppress=missingIncludeSystem
    --inline-suppr
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    knolleary/PubSubClient@^2.8
    links2004/WebSockets@^2.4.0
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    ESP8266WiFi
    ESP8266WebServer
    ESP8266mDNS
    LittleFS
    DNSServer
    ArduinoOTA
extra_scripts =
    pre:scripts/build_increment.py
    pre:scripts/gzip_www.py

; ─────────────────────────────────────────────────────────────────────────────
; ROLE: sensor_only — D1 Mini + US-100 (always-on, AC or USB powered)
; ─────────────────────────────────────────────────────────────────────────────
[env:sensor_only_d1mini]
extends = common
board = d1_mini
build_flags =
    -D FLM_ROLE_SENSOR
    -D FLM_BOARD_D1MINI
    -D FLM_BATTERY_MONITOR        ; enable A0 battery voltage monitoring
    -D VERSION_MAJOR=1
    -D VERSION_MINOR=1
    -D VERSION_PATCH=0
    -D ARDUINOJSON_ENABLE_COMMENTS=1

; ─────────────────────────────────────────────────────────────────────────────
; ROLE: sensor_only — D1 Mini + US-100 + Deep Sleep (battery-optimised)
; Hardware: connect D0 → RST for deep sleep wake
; Battery: 2× 32700 LiFePO4 → MP1584 5V buck → D1 Mini
; Charging: CH224K (9V PD) + CN3058E (2S LiFePO4 charger) via USB-C
; Expected battery life: ~37 days @ 60s publish interval
; ─────────────────────────────────────────────────────────────────────────────
[env:sensor_only_d1mini_sleep]
extends = common
board = d1_mini
build_flags =
    -D FLM_ROLE_SENSOR
    -D FLM_BOARD_D1MINI
    -D FLM_BATTERY_MONITOR        ; A0 battery monitoring (100k+24k divider)
    -D FLM_DEEP_SLEEP_ENABLED     ; enable deep sleep between publishes
    -D FLM_SLEEP_SECONDS=55       ; sleep duration (publish every 60s total)
    -D FLM_SLEEP_LOW_BATT=120     ; extend sleep to 2min when battery LOW
    -D FLM_SLEEP_CRITICAL=300     ; extend sleep to 5min when battery CRITICAL
    -D VERSION_MAJOR=1
    -D VERSION_MINOR=1
    -D VERSION_PATCH=0
    -D ARDUINOJSON_ENABLE_COMMENTS=1

; ─────────────────────────────────────────────────────────────────────────────
; ROLE: sensor_only — NodeMCU v2 (original board, AC/USB powered)
; ─────────────────────────────────────────────────────────────────────────────
[env:sensor_only_nodemcu]
extends = common
board = nodemcuv2
build_flags =
    -D FLM_ROLE_SENSOR
    -D VERSION_MAJOR=1
    -D VERSION_MINOR=1
    -D VERSION_PATCH=0
    -D ARDUINOJSON_ENABLE_COMMENTS=1

; ─────────────────────────────────────────────────────────────────────────────
; ROLE: motor_relay — GPIO relay pump control (home motor)
; ─────────────────────────────────────────────────────────────────────────────
[env:motor_relay]
extends = common
board = d1_mini
build_flags =
    -D FLM_ROLE_MOTOR_RELAY
    -D FLM_BOARD_D1MINI
    -D VERSION_MAJOR=1
    -D VERSION_MINOR=1
    -D VERSION_PATCH=0
    -D ARDUINOJSON_ENABLE_COMMENTS=1

; ─────────────────────────────────────────────────────────────────────────────
; ROLE: motor_sms — SMS pump control (Taro Smart Panel, farm 5HP motor)
; Hardware: D1 Mini + SIM800L on D1(RX) / D2(TX)
; ─────────────────────────────────────────────────────────────────────────────
[env:motor_sms]
extends = common
board = d1_mini
build_flags =
    -D FLM_ROLE_MOTOR_SMS
    -D FLM_BOARD_D1MINI
    -D VERSION_MAJOR=1
    -D VERSION_MINOR=1
    -D VERSION_PATCH=0
    -D ARDUINOJSON_ENABLE_COMMENTS=1
