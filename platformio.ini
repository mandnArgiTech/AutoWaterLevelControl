; PlatformIO Project Configuration File
; FluidLevelMonitor — Sintex Tank Water Level Monitoring System
;
; Three firmware roles — compiled from the same codebase:
;
;   sensor_only   — Level measurement (US-100, HC-SR04, TF-Luna, XKC-KD200)
;                   Default role. Deploy one per tank.
;                   Publishes: {deviceTag}/water/level
;
;   motor_relay   — Relay-based pump control (home, small motors)
;                   GPIO relay, no sensor pipeline.
;                   Subscribes: {deviceTag}/motor/command
;
;   motor_sms     — SMS-based pump control (Taro Smart Panel, farm 5HP motor)
;                   SIM800L/A6 GSM shield, configurable ON/OFF SMS messages.
;                   Subscribes: {deviceTag}/motor/command
;
; Build specific env:  pio run -e sensor_only
;                      pio run -e motor_relay
;                      pio run -e motor_sms
; Upload:              pio run -e motor_relay -t upload
; Monitor:             pio device monitor -b 115200

[common]
platform  = espressif8266
board     = nodemcuv2
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
upload_speed = 921600
upload_protocol = esptool
check_tool = cppcheck
check_flags =
    --suppress=missingIncludeSystem
    --inline-suppr
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    knolleary/PubSubClient@^2.8
    links2004/WebSockets@^2.4.0
    ESP8266WiFi
    ESP8266WebServer
    ESP8266mDNS
    LittleFS
    DNSServer
    ArduinoOTA
extra_scripts =
    pre:scripts/build_increment.py
    pre:scripts/gzip_www.py

; ─────────────────────────────────────────────────────────────────────────────
; ROLE: sensor_only — level measurement, no motor control
; Deploy: one per tank
; ─────────────────────────────────────────────────────────────────────────────
[env:sensor_only]
extends = common
build_flags =
    -D FLM_ROLE_SENSOR
    -D VERSION_MAJOR=1
    -D VERSION_MINOR=1
    -D VERSION_PATCH=0
    -D ARDUINOJSON_ENABLE_COMMENTS=1

; ─────────────────────────────────────────────────────────────────────────────
; ROLE: motor_relay — GPIO relay pump control
; Deploy: one per motor (home pump)
; Hardware: ESP8266 + relay module on D5/GPIO14 (configurable)
; ─────────────────────────────────────────────────────────────────────────────
[env:motor_relay]
extends = common
build_flags =
    -D FLM_ROLE_MOTOR_RELAY
    -D VERSION_MAJOR=1
    -D VERSION_MINOR=1
    -D VERSION_PATCH=0
    -D ARDUINOJSON_ENABLE_COMMENTS=1

; ─────────────────────────────────────────────────────────────────────────────
; ROLE: motor_sms — SMS control via SIM800L/A6 GSM shield
; Deploy: one per SMS-controlled motor (Sangareddy farm 5HP + Taro Smart Panel)
; Hardware: ESP8266 + SIM800L on D1(RX)/D2(TX) (configurable)
; Configure targetPhone, onMessage, offMessage in config.json or web UI
; ─────────────────────────────────────────────────────────────────────────────
[env:motor_sms]
extends = common
build_flags =
    -D FLM_ROLE_MOTOR_SMS
    -D VERSION_MAJOR=1
    -D VERSION_MINOR=1
    -D VERSION_PATCH=0
    -D ARDUINOJSON_ENABLE_COMMENTS=1
